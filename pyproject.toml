[tool.poetry]
name = "playwright-poc"
version = "0.1.0"
description = "Playwright + pytest proof-of-concept test automation project"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10"
playwright = ">=1.62.0"
pytest = ">=9.1.1"
pytest-playwright = ">=0.9.0"
pytest-html = ">=4.2.0"
pytest-metadata = ">=3.1.1"
pytest-xdist = ">=3.8.0"
allure-pytest = ">=2.16.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
